name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Do not paste your `.env` file, `APP_KEY`, database passwords or other secrets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `php artisan serve`
        2. Go to '...'
        3. Submit '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication (register / login / password reset)
        - Posts (create / show / image upload)
        - Profiles
        - Database / migrations
        - Front-end assets (Laravel Mix)
        - Docker / Sail
        - Other
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: e.g. 8.0.30
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: e.g. MySQL 8.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Ubuntu 22.04, Windows 11, macOS 14
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Relevant output from `storage/logs/laravel.log` or the terminal.
      render: shell
